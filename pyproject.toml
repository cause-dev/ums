[project]
name = "django-ums"
version = "0.1.0"
description = "User Management System"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "psycopg[binary]>=3.3.9",
]

[tool.uv.build-backend]
module-name = "accounts"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs-ext>=6.1.2",
    "django-types>=0.24.0",
    "djangofmt>=1.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.djangofmt]
line-length = 120
indent-width = 4
profile = "django"
html-void-self-closing = "never"
