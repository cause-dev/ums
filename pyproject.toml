[project]
name = "django-ums"
version = "0.1.0"
description = "User Management System"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "django-allauth>=65.22.1",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "psycopg[binary]>=3.3.9",
]

[tool.uv.build-backend]
module-name = "accounts"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "django-stubs-ext>=6.1.2",
    "django-types>=0.24.0",
    "djangofmt>=1.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.djangofmt]
line-length = 120
indent-width = 4
profile = "django"
html-void-self-closing = "never"

[tool.djangofmt.lint]
select = ["category:default", "unsorted-tailwind-classes"]
fix = true

[tool.djangofmt.lint.unsorted-tailwind-classes]
prefix = "um:"

[tool.ruff]
extend-exclude = ["**/migrations/*.py"]

[tool.djls]
django_settings_module = "temp_dj_project.config.settings"
venv_path = ".venv"
pythonpath = ["src"]

[tool.djls.diagnostics.severity]
S108 = "off"
