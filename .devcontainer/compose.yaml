# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: ums
services:
  db:
    image: "dhi.io/postgres:18.6-alpine3.24"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: localhost/ums:dev
    build:
      context: ../
      dockerfile: Containerfile
      target: dev
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../:/app:Z
      - uv_cache:/root/.cache/uv
      - uv_venv:/app/.venv
      - zed_server:/root/.zed_server
      - zed_data:/root/.local/share/zed
    depends_on:
      db:
        condition: service_healthy

volumes:
  data:
  uv_venv:
  uv_cache:
    external: true
    name: uv_cache
  zed_server:
    external: true
    name: zed_server
  zed_data:
    external: true
    name: zed_data
