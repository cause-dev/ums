{% load django_htmx %}
{% load static %}

<!DOCTYPE html>
<html lang="en" class="um-theme" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href='{% static "accounts/css/app.css" %}'>
        {% htmx_script %}
        <title>{% block title %} {{ section.title }} {% endblock title %}</title>
    </head>
    <body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}' class="um:bg-base-200">
        {% include "components/header.html" %}

        {% block message %}
            <div role="alert" class="um:ums-alert um:ums-alert-warning">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="um:h-6 um:w-6 um:shrink-0 um:stroke-current"
                    fill="none"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                    />
                </svg>
                <span>Warning: Invalid email address!</span>
            </div>
        {% endblock message %}

        {% block content %}
        {% endblock content %}
    </body>
</html>
