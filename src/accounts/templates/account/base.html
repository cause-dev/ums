{% load django_htmx %}
{% load static %}

<!DOCTYPE html>
<html lang="en" class="um-theme" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href='{% static "accounts/css/app.css" %}'>
        <title>{% block title %} {{ section.title }} {% htmx_script %} {% endblock title %}</title>
    </head>
    <body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}' class="um:bg-base-200">
        {% include "components/header.html" %}
        {% block content %}
        {% endblock content %}
    </body>
</html>
