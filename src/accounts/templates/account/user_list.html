{% extends "account/base.html" %}
{% block title %}
    Users
{% endblock title %}
{% block content %}
    <h1>Users</h1>
    <div class="um:rounded-box um:border-base-content/5 um:bg-base-100 um:overflow-x-auto um:border">
        <table class="um:ums-table">
            <!-- head -->
            <thead>
                <tr>
                    <th></th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Is Active</th>
                    <th>Last Login</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- row 1 -->
                {% for user in users %}
                    {% include "account/partials/user_partials.html#user_row" with user=user %}
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock content %}
